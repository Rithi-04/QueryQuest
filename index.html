<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SQL Among Us — There’s an Impostor in the Database!</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="loadingOverlay" class="overlay" role="status" aria-live="polite">
    <div class="overlay-box">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loadingText">Loading SQL engine&hellip;</p>
    </div>
  </div>

  <header class="topbar">
    <button id="sidebarToggle" class="icon-btn" aria-label="Toggle schema panel" aria-expanded="true">&#9776;</button>

    <div class="brand">
      <span class="brand-title">SQL AMONG US</span>
      <span class="brand-sub">Investigation Console</span>
    </div>

    <div class="dataset-picker">
      <label for="datasetSelect" class="visually-hidden">Dataset</label>
      <select id="datasetSelect">
        <option value="main" selected>Main game</option>
        <option value="demo">Easy demo</option>
      </select>
    </div>

    <button id="howToPlayBtn" class="icon-btn" aria-label="How to play">?</button>
  </header>

  <div class="dialect-note">
    <span>Dialect: MySQL-style SQL running on SQLite. Most SELECT syntax works the same.</span>
    <button id="differencesBtn" class="link-btn">What's different?</button>
  </div>

  <div id="panelBackdrop" class="panel-backdrop" hidden></div>

  <main class="layout">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <h2>Schema</h2>
        <span id="tableCount" class="muted-small"></span>
      </div>
      <div id="schemaPanel" class="schema-panel" aria-live="polite"></div>
    </aside>

    <section class="workspace">
      <div class="editor-toolbar">
        <button id="runBtn" class="primary-btn" disabled>Run &#9654; <span class="kbd">Ctrl+Enter</span></button>
        <button id="historyBtn" class="secondary-btn">History</button>
        <button id="clearEditorBtn" class="secondary-btn">Clear</button>
        <span id="queryHint" class="muted-small">Only SELECT / WITH statements are allowed.</span>
      </div>

      <textarea id="sqlInput" class="sql-editor" spellcheck="false"
        placeholder="SELECT * FROM crewmates LIMIT 10;"
        aria-label="SQL query editor"></textarea>

      <div id="errorBox" class="error-box" hidden></div>

      <div class="results-toolbar">
        <span id="resultMeta" class="muted-small">Run a query to see results here.</span>
        <button id="copyCsvBtn" class="secondary-btn" disabled>Copy as CSV</button>
      </div>

      <div id="resultsWrap" class="results-wrap">
        <table id="resultsTable" class="results-table" hidden>
          <thead id="resultsHead"></thead>
          <tbody id="resultsBody"></tbody>
        </table>
      </div>
    </section>

    <aside id="historyPanel" class="history-panel" hidden>
      <div class="sidebar-header">
        <h2>Query history</h2>
        <button id="clearHistoryBtn" class="link-btn">Clear</button>
      </div>
      <ol id="historyList" class="history-list"></ol>
    </aside>
  </main>

  <div id="modalLayer" class="modal-layer" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button id="modalClose" class="icon-btn modal-close" aria-label="Close">&times;</button>
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="vendor/sql-wasm.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
